<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Biggest Number</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            margin-top: 50px; 
        }
        button { 
            padding: 10px 20px; 
            font-size: 16px; 
            cursor: pointer; 
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h2>Find the Biggest of 5 Numbers</h2>
    <p>Click the button below to find the largest number among <strong>12, 45, 7, 89, and 34</strong>.</p>
    
    <button onclick="runFindBiggest()">Find Biggest Number</button>

    <script>
        
        function findBiggestOfFive(num1, num2, num3, num4, num5) {
            
            let biggest = Math.max(num1, num2, num3, num4, num5);
            
            
            alert("The biggest number is: " + biggest);
        }

        function runFindBiggest() {
            findBiggestOfFive(12, 45, 7, 89, 34);
        }
    </script>

</body>
</html>
