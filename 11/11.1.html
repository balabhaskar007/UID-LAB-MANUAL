<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Username Validation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .form-container h2 {
            color: #333;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #2575fc;
            box-shadow: 0 0 8px rgba(37, 117, 252, 0.2);
        }

        .feedback-msg {
            display: block;
            margin-top: 8px;
            font-size: 13px;
            min-height: 18px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Set Username</h2>
        
        <div class="input-group">
            <input type="text" id="usernameInput" placeholder="Enter your username..." autocomplete="off">
            <span id="feedbackMessage" class="feedback-msg"></span>
        </div>

        <button class="submit-btn">Continue</button>
    </div>

    <script>
        const inputField = document.getElementById('usernameInput');
        const feedbackText = document.getElementById('feedbackMessage');

        inputField.addEventListener('input', function() {
            const currentLength = inputField.value.length;

            if (currentLength === 0) {
                feedbackText.textContent = '';
                inputField.style.borderColor = '#ddd';
            } else if (currentLength < 5) {
                feedbackText.textContent = 'Username must be at least 5 characters.';
                feedbackText.style.color = '#e74c3c';
                inputField.style.borderColor = '#e74c3c';
            } else {
                feedbackText.textContent = 'Looks good!';
                feedbackText.style.color = '#2ecc71';
                inputField.style.borderColor = '#2ecc71';
            }
        });
    </script>

</body>
</html>
