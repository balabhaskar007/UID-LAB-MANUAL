<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Number Validation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Stylish indigo to purple gradient */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-card {
            background-color: #ffffff;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }

        /* Focus state before validation */
        input:focus {
            background-color: #ffffff;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
        }

        input.is-valid {
            border-color: #10b981; 
            background-color: #f0fdf4;
        }

        input.is-invalid {
            border-color: #ef4444; 
            background-color: #fef2f2;
        }

        .feedback-msg {
            position: absolute;
            bottom: -20px;
            left: 5px;
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .feedback-msg.show {
            opacity: 1;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>Contact Details</h2>
        
        <div class="input-group">
            <input type="tel" id="mobileInput" placeholder="Enter 10-digit mobile number" autocomplete="off">
            <span id="feedbackMessage" class="feedback-msg"></span>
        </div>

        <button class="submit-btn">Verify Number</button>
    </div>

    <script>
        const mobileInput = document.getElementById('mobileInput');
        const feedbackMessage = document.getElementById('feedbackMessage');
        const tenDigitRegex = /^\d{10}$/;

        mobileInput.addEventListener('blur', function() {
            const value = mobileInput.value.trim();

            mobileInput.classList.remove('is-valid', 'is-invalid');
            feedbackMessage.classList.remove('show');

            if (value === '') return;

            if (tenDigitRegex.test(value)) {
                mobileInput.classList.add('is-valid');
                feedbackMessage.textContent = 'Valid mobile number.';
                feedbackMessage.style.color = '#10b981';
                feedbackMessage.classList.add('show');
            } else {
                // Error state
                mobileInput.classList.add('is-invalid');
                feedbackMessage.textContent = 'Please enter exactly 10 digits.';
                feedbackMessage.style.color = '#ef4444';
                feedbackMessage.classList.add('show');
            }
        });
        mobileInput.addEventListener('focus', function() {
            mobileInput.classList.remove('is-valid', 'is-invalid');
            feedbackMessage.classList.remove('show');
        });
    </script>

</body>
</html>
