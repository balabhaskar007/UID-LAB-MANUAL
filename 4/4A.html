<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
</head>
<body style="background-color:rgb(111, 78, 55)">
    <section>
    <form>
    <table style="width:fit-content; background-color:rgb(234, 221, 202); border: 5px; border-radius: 12px; box-shadow:  0 5px 12px 0 rgba(0, 0, 0, 0.3);" cellpadding="10" cellspacing="0" align="center">
        <div><th style="color:rgba(111, 78, 55);background-color:rgb(182,150,102);border: 5px;border-radius: 5px; " colspan="12">Student details</th></div>
        <div style=" border: 5px;border-radius: 12px;display:flex; justify-content:center ;align-items: center;margin:20px; padding-left: 10px;padding-right: 10px;">
        <tr>
            <td><label for="name"></label>Full name: </td>
            <td><input type="text" id="name" placeholder="Enter your name..."></td>
        </tr>
        <tr>
            <td>
                <label for="email">E-mail</label> 
            </td>
        <td><input type="email" placeholder="abc@gmail.com"></td>
        </tr>
        <tr>
            <td><label for="phnno"></label>Phone number: </td>
            <td><input type="number"placeholder="ex: +91 1234567891"></td>
        </tr>
        <tr>
            <td>
                <label for="gender">Gender</label>
                <td><input type="radio" name="gender" value="Male">Male <input type="radio" name="gender" value="Female">Female <input type="radio" name="gender" value="Others">Others</td>
        </tr>
        <tr>
            <td><label for="course">Course applying for: </label></td>
            <td><select name="course" id="coursereg">
                <option value="select">select</option>
                <option value="B.Tech">B.tech</option>
                <option value="B.arch">B.Arch</option>
                <option value="B.sc">B.sc</option>  
            </select></td>
        </tr>
        <tr>
            <td><label for="hobbies">Hobbies:</label></td>
            <td><input type="checkbox">Sports <input type="checkbox">Music <input type="checkbox">Gaming</td>
        </tr>
        <tr>
            <td><label for="dob">Date Of Birth: </label></td>
            <td><input type="date" id="dob"></td>
        </tr>
        <tr>
            <td><label for="certi">Upload certificates</label></td>
            <td><input type="file" id="certi" multiple></td>
        </tr>
        <tr>
            <td><label for="address">Address: </label></td><br>
            <td><textarea id="address" name="address" rows="4" cols="50" placeholder="Enter your address here..."></textarea></td>
        </tr>
        <tr>
            <td colspan="12" align="center"><input type="submit"></td>
        </tr>
        </div>
    </table>
    </form>
    </section>
</body>
</html>
