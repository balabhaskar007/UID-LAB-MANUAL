<!DOCTYPE html>
<html>
<body style="font-family: Arial; display: flex; justify-content: center; background: transparent;">

    <table style="width:80%; background: white; border: 1px solid #ccc; border-radius: 20px; border-collapse: separate; padding: 20px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1);">
        <tr>
            <td style="padding:10px;">Username:</td>
            <td><input type="text" style="width:100%; padding:8px; border-radius:10px; border:1px solid #ccc;"></td>
        </tr>
        <tr>
            <td style="padding:10px;">Password:</td>
            <td><input type="password" style="width:100%; padding:8px; border-radius:10px; border:1px solid #ccc;"></td>
        </tr>
        <tr>
            <td colspan="2" align="center" style="padding-top:20px;">
                <input type="submit" value="Login" style="width:100%; padding:10px; border-radius:20px; border:none; background-color:#8B0037; color:white; cursor:pointer; font-weight:bold;">
            </td>
        </tr>
    </table>

</body>
</html>
