<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home Content</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: 'Poppins', sans-serif;
            color: #ffffff; 
            /* Notice there is no background here, letting the parent video show through */
        }

        .mainheading {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4); 
            padding: 20px;
            margin: 0 auto 40px auto; 
            border-radius: 15px;
            max-width: 600px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);    
            letter-spacing: 2px;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap; 
        }

        .music-card {
            background-color: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4); 
            border-radius: 20px;
            padding: 25px;
            width: 300px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
        }

        .music-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
        }

        .music-card h2 { margin-top: 0; font-size: 24px; }

        .music-card img {
            width: 100%;
            height: 200px;
            object-fit: cover; 
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .music-card p {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #f1f1f1;
        }

        button {
            margin-top: auto; 
            padding: 12px 30px;
            border: none;
            border-radius: 25px; 
            background-color: white; 
            color: black;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: rgb(220, 220, 220);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1 class="mainheading">-DIGITAL PLATFORMS-</h1>

    <div class="card-container">
        <article class="music-card">
            <h2>Spotify</h2>
            <img src="https://i.pinimg.com/736x/a8/9a/9e/a89a9e7d33dfbd9a83363c4c88eedf1c.jpg" alt="Spotify Concept">
            <p>Spotify is a popular digital music streaming service...</p>
            <button>Know more</button>
        </article>

        <article class="music-card">
            <h2>Netflix</h2>
            <img src="https://static.vecteezy.com/system/resources/previews/020/336/027/non_2x/netflix-logo-netflix-icon-free-free-vector.jpg" alt="Netflix">
            <p>Netflix is a popular streaming platform where users can watch movies...</p>
            <button>Know more</button>
        </article>

        <article class="music-card">
            <h2>Pinterest</h2>
            <img src="https://i.pinimg.com/1200x/8d/19/2b/8d192b51f0f8a396cf583ee0c68f7e4d.jpg" alt="Pinterest">
            <p>Pinterest is a popular social media platform where users can discover...</p>
            <button>Know more</button>
        </article>
    </div>

</body>
</html>
