<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Platforms</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            color: #ffffff; 
            overflow: hidden; /* Prevents double scrollbars */
        }

        .bg-video {
            position: fixed; 
            top: 0;
            left: 0;
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            z-index: -2;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.4); 
            z-index: -1; 
        }

        /* New Navigation Bar Styles */
        nav {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4); 
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: color 0.3s, transform 0.3s;
        }

        nav a:hover {
            color: #cce7ff;
            transform: scale(1.1);
        }
        .iframe-wrapper {
            width: 100%;
            height: calc(100vh - 80px); 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline class="bg-video">
        <source src="/Users/balabhaskar/Downloads/12421542_3840_2160_30fps.mp4" type="video/mp4">
    </video>

    <div class="video-overlay"></div>

    <nav>
        <a href="home.html" target="content-frame">Home</a>
        <a href="about.html" target="content-frame">About</a>
        <a href="contact.html" target="content-frame">Contact</a>
    </nav>

    <div class="iframe-wrapper">
        <iframe name="content-frame" src="home.html" title="Content Frame"></iframe>
    </div>

</body>
</html>
