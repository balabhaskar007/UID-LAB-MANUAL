<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="products.css">
</head>
<body>

    <input type="radio" name="view" id="show-electronics" checked>
    <input type="radio" name="view" id="show-clothing">
    <input type="radio" name="view" id="show-home">
    <input type="radio" name="view" id="show-books">

    <div class="store-layout">
        <aside class="sidebar">
            <h1>Store<span>.</span></h1>
            <nav>
                <label for="show-electronics">Electronics</label>
                <label for="show-clothing">Clothing</label>
                <label for="show-home">Home</label>
                <label for="show-books">Books</label>
            </nav>
        </aside>

        <main class="content">
            
            <section id="electronics" class="product-group">
                <h2 class="hero-text">Electronics. <span>Innovation in hand.</span></h2>
                <div class="grid">
                    <div class="card">
                        <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=400&q=80">
                        <h3>MacBook Pro</h3>
                        <p class="price">From ₹1,29,900</p>
                    </div>
                    <div class="card">
                        <img src="https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?auto=format&fit=crop&w=400&q=80">
                        <h3>iPhone 15</h3>
                        <p class="price">From ₹79,900</p>
                    </div>
                </div>
            </section>

            <section id="clothing" class="product-group">
                <h2 class="hero-text">Clothing. <span>Wear the future.</span></h2>
                <div class="grid">
                    <div class="card">
                        <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=400&q=80">
                        <h3>Essential Tee</h3>
                        <p class="price">From ₹1,500</p>
                    </div>
                </div>
            </section>

            </main>
    </div>
</body>
</html>
