<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        /* CSS for the iframe content */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f4f9; padding: 10px; } /* Matches main page background */
        
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px; 
        }

        .product-card {
            background-color: white;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.12);
        }

        .product-card img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .product-card h4 { font-size: 1.2rem; color: #2c3e50; margin-bottom: 5px; }
        .product-card .price { color: rgb(236, 182, 21); font-weight: 900; font-size: 1.3rem; margin-bottom: 15px; margin-top: auto; }
        
        .product-card button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .product-card button:hover { background-color: rgb(236, 182, 21); }
    </style>
</head>
<body>
    <div class="product-grid">
        <div class="product-card">
            <img src="https://cdn.tasteatlas.com/images/dishes/ceff65c140064d6285fc3814534a349b.jpg?w=1476&h=830" alt="Shahi Paneer">
            <h4>Shahi Paneer</h4>
            <p class="price">₹249</p>
            <button>Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="https://cdn.tasteatlas.com/images/dishes/7cd03979f70949c08f779a686919d7e3.jpg?w=1476&h=830" alt="Malai Kofta">
            <h4>Malai Kofta</h4>
            <p class="price">₹249</p>
            <button>Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="https://cdn.tasteatlas.com/images/dishes/617f5d93003c43a992244eff2dd52b6d.jpg?w=1476&h=830" alt="Dal Tadka">
            <h4>Dal Tadka</h4>
            <p class="price">₹199</p>
            <button>Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=800&q=80" alt="Butter Chicken">
            <h4>Butter Chicken</h4>
            <p class="price">₹349</p>
            <button>Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1596805178229-282da580a373?w=800&q=80" alt="Gulab Jamun">
            <h4>Gulab Jamun</h4>
            <p class="price">₹120</p>
            <button>Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1544145945-f90425340c7e?w=800&q=80" alt="Mango Lassi">
            <h4>Mango Lassi</h4>
            <p class="price">₹99</p>
            <button>Add to Cart</button>
        </div>
    </div>
</body>
</html>
