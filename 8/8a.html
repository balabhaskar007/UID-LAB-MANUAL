<!DOCTYPE html>
<html>
<head>
<title>lab8a</title>
<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height:850px;
    margin: 0;
    background-color:white;
}

div{
    width: 80px;
    height: 80px;
    background: linear-gradient(45deg, rgb(255,0,204), rgb(51,51,255));
    border-radius: 15px; 
    
    animation: 
    spin 4s linear infinite,
    pulse 2s ease-in-out infinite alternate;
}


@keyframes spin {
    from {
    rotate: 0deg;
    }
    to {
    rotate: 360deg;
    }
}

@keyframes pulse {
    0% { 
    scale: 1;
    box-shadow: 0 0 20px rgba(255, 0, 204, 0.4); 
    }
    100% { 
    scale: 1.4; 
    box-shadow: 0 0 60px rgba(51, 51, 255, 0.9); 
    }
}
</style>
</head>
<body>

<div></div>

</body>
</html>
