<!DOCTYPE html>
<html>
<head>
<title>Lab8b</title>
<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height:850px ;
    margin: 0;
    background-color:white;
}

div {
    width: 60px;
    height: 60px;
    background:linear-gradient(45deg, rgb(22, 191, 213), rgb(21, 93, 117));;
    border-radius: 50%;

    animation: bounce 0.8s ease-in-out infinite alternate;
}

@keyframes bounce {
    0% {
    transform: translateY(-100px);
    box-shadow: 0 0 20px rgba(22, 191, 213,0.4)
    }
    100% {
    transform: translateY(100px);
    box-shadow:0 0 20px rgba(21, 93, 117,0.9);
    }
}
</style>
</head>
<body>

<div></div>

</body>
</html>
